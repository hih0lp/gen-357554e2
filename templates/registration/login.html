{% extends 'base.html' %}
{% block title %}Вход в систему{% endblock %}
{% block content %}
    <div class="min-h-screen flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Вход в админ-панель</h2>
            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label class="block text-gray-700 mb-2 font-medium">Имя пользователя</label>
                    <input type="text" name="username" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all duration-300">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2 font-medium">Пароль</label>
                    <input type="password" name="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all duration-300">
                </div>
                <button type="submit" class="btn-primary w-full text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-[1.02]">
                    <i class="fas fa-sign-in-alt mr-2"></i>Войти
                </button>
            </form>
            <div class="mt-6 text-center text-gray-500">
                <p>Доступ только для администраторов магазина</p>
            </div>
        </div>
    </div>
{% endblock %}
